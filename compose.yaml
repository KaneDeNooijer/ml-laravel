services:
  app:
    build:
      context: .
      target: dev
    init: true
    environment:
      APP_NAME: LLMaaltijd
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:bGxtYWFsdGlqZC1kZXYta2V5LTAwMDAwMDAwMDAwMDA=}
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-5679}
      APP_LOCALE: nl
      APP_FALLBACK_LOCALE: nl
      APP_FAKER_LOCALE: nl_NL
      DB_CONNECTION: mongodb
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ml_laravel}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      PYTHON_API_URL: ${PYTHON_API_URL:-http://host.docker.internal:8101}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5679}:5678"
    volumes:
      - .:/app
      - composer_vendor:/app/vendor
      - laravel_cache:/app/bootstrap/cache
      - laravel_storage:/app/storage
    command: >-
      sh -c "mkdir -p bootstrap/cache storage/app/public
      storage/framework/cache/data storage/framework/sessions
      storage/framework/views storage/logs
      && (test -f .env || cp .env.example .env)
      && composer install --no-interaction --prefer-dist
      && php artisan migrate --force
      && exec frankenphp run --config /etc/frankenphp/Caddyfile"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:5678/api/health') === false ? 1 : 0);"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  mongo:
    image: mongo:8.0
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  vite:
    image: node:22-alpine
    init: true
    working_dir: /app
    environment:
      APP_URL: http://localhost:${APP_PORT:-5679}
      VITE_HOST: 0.0.0.0
      VITE_PORT: ${VITE_PORT:-5174}
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_HMR_PORT: ${VITE_PORT:-5174}
    ports:
      - "${VITE_PORT:-5174}:${VITE_PORT:-5174}"
    volumes:
      - .:/app
      - pnpm_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    command:
      - sh
      - -c
      - |
        set -e
        corepack enable
        pnpm install --frozen-lockfile
        rm -f public/hot

        cleanup() {
            rm -f public/hot

            if [ -n "$${vite_pid:-}" ]; then
                kill "$${vite_pid}" 2>/dev/null || true
            fi
        }

        trap cleanup EXIT INT TERM
        pnpm run dev &
        vite_pid=$$!
        wait "$${vite_pid}"

volumes:
  composer_vendor:
  laravel_cache:
  laravel_storage:
  mongodb_data:
  pnpm_modules:
  pnpm_store:
